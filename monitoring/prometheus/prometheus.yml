global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The app's metrics live on the private management port, never on the public 8080.
  - job_name: uptimewatch
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8081"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
