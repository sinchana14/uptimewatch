spring:
  datasource:
    url: jdbc:h2:mem:uptimewatch-test;DB_CLOSE_DELAY=-1

# Serve actuator on the main (mock) port so MockMvc can reach /actuator/prometheus.
management:
  server:
    port: ""

uptimewatch:
  api-key: test-key
  # Keep the scheduler from making real network calls during tests.
  scheduler-initial-delay-ms: 3600000
  scheduler-tick-ms: 3600000
  default-timeout-ms: 2000
  seed-monitors: []
