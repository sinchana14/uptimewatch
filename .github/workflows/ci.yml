name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/uptimewatch

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests
        run: mvn -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  config:
    name: Validate monitoring config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose file
        run: docker compose config --quiet
      - name: Prometheus config and alert rules (promtool)
        run: |
          docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v2.54.1 check config /etc/prometheus/prometheus.yml
      - name: Grafana dashboard is valid JSON
        run: python3 -m json.tool monitoring/grafana/dashboards/uptimewatch.json > /dev/null

  stack:
    name: Docker image and full-stack smoke test
    needs: [test, config]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start app, PostgreSQL, Prometheus and Grafana
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Status page and API answer
        run: |
          curl -fsS http://localhost:8080/ | grep -q "UptimeWatch"
          count=$(curl -fsS http://localhost:8080/api/monitors | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
          echo "monitors: $count"; test "$count" -gt 0
      - name: Write API is protected
        run: test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/admin/verify)" = "401"
      - name: Metrics are private (not served on the public port)
        run: test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/prometheus)" = "404"
      - name: Prometheus scrapes the app
        run: |
          for i in $(seq 1 30); do
            health=$(curl -fsS 'http://localhost:9090/api/v1/targets?state=active' \
              | python3 -c "import json,sys; t=[x for x in json.load(sys.stdin)['data']['activeTargets'] if x['labels']['job']=='uptimewatch']; print(t[0]['health'] if t else 'missing')")
            echo "uptimewatch target: $health"; [ "$health" = "up" ] && break; sleep 5
          done
          [ "$health" = "up" ]
          curl -fsS 'http://localhost:9090/api/v1/rules' | grep -q SiteDown
      - name: Grafana has the dashboard
        run: |
          for i in $(seq 1 20); do curl -fsS http://localhost:3000/api/health && break; sleep 3; done
          curl -fsS -u admin:admin http://localhost:3000/api/dashboards/uid/uptimewatch-overview | grep -q "UptimeWatch Overview"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Scan image for vulnerabilities (Trivy, report only)
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.56.2 \
            image --severity HIGH,CRITICAL --ignore-unfixed --no-progress --exit-code 0 uptimewatch:local
      - name: Stop stack
        if: always()
        run: docker compose down -v

  publish:
    name: Publish image to GHCR
    needs: stack
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
